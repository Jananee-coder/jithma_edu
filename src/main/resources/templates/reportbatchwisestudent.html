<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragment :: headerFragment}">
</head>

<body>

    <!-- Container start -->
    <div class="container-fluid">
        <!-- Sidebar -->
        <div th:replace="~{fragment :: sidebarFrgment}"></div>
        <!-- View Content -->
        <div class="view-content">
            <!-- Title Card -->
            <div class="card div-card mx-auto mt-3" style="max-width: 70rem;">
                <div class="card-header div-head">
                    <div class="row mt-2">
                        <div class="d-flex justify-content-center">
                            <i class="fa-solid fa-file-lines"></i>
                            <h3 class="h3 ms-3">
                                Batch-wise Student Report
                            </h3>
                            <div class="col text-end">
                                <button type="button" id="btnPrintReport" class="btn btn-light fw-bold"
                                    onclick="buttonPrint();">
                                    <i class="fa-solid fa-print"></i>
                                    Print Report
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Filter Card -->
            <div class="card div-card mx-auto mt-3" style="max-width: 70rem;">
                <div class="card-body">
                    <div class="row">
                        <!-- Grade -->
                        <div class="col-lg-3 col-md-6">
                            <label for="selectGrade" class="form-label fw-bold">
                                Grade :
                            </label>
                            <select id="selectGrade" class="form-select form-input"
                                onchange="this.style.border='2px solid rgb(107, 153, 194)';">
                            </select>
                        </div>
                        <!-- Teacher -->
                        <div class="col-lg-3 col-md-6">
                            <label for="selectTeacher" class="form-label fw-bold">
                                Teacher :
                            </label>
                            <select id="selectTeacher" class="form-select form-input"
                                onchange="this.style.border='2px solid rgb(107, 153, 194)';">
                            </select>
                        </div>
                        <!-- Batch -->
                        <div class="col-lg-4 col-md-6">
                            <label for="selectBatch" class="form-label fw-bold">
                                Batch Name :
                            </label>
                            <select id="selectBatch" class="form-select form-input"
                                onchange="this.style.border='2px solid rgb(107, 153, 194)';">
                            </select>
                        </div>

                        <!-- Generate Button -->
                        <div class="col-lg-2 col-md-6 d-flex align-items-end">
                            <button type="button" id="btnGenerateReport" class="btn fw-bold"
                                style="background-color: rgb(162, 197, 227);"
                                onclick="generateBatchWiseStudentReport();">
                                <i class="fa-solid fa-file-lines"></i>
                                Generate
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Report Table -->
                <div class="row mx-3 mb-3">
                    <div class="col">
                        <div class="table-responsive">
                            <div id="printArea">
                                <table id="tableBatchWiseStudent"
                                    class="table table-hover table-bordered table-striped">
                                    <thead class="text-dark tablehead tableh ">
                                        <tr>
                                            <th>Id</th>
                                            <th>Student No</th>
                                            <th>Student Name</th>
                                            <th>Mobile Number</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tableBodyBatchWiseStudent">
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- View Content End -->
    </div>
    <!-- Container End -->


    <div th:replace="~{fragment :: footerFragment}"></div>

    <!-- Report JS -->
    <script src="reportjs/reportbatchwisestudent.js"></script>

</body>

</html>
