        // Ada date eka gannawa
        today = new Date();

        // Maas 3k passe yanna
        // Udaharanayak: July nam April idan patan gannawa
        today.setMonth(today.getMonth() - 3);


        // Chart ekata month name saha income store karanna arrays hadanawa
        monthName = new Array();
        monthQuentity = new Array();


        // Maas 3k passe idan ada masa dakwa (total masa 4k) income data gannawa
        for (let index = 0; index < 4; index++) {

            // Current index ekata adala month eka hadanawa
            // index = 0  → 2026-04
            // index = 1  → 2026-05
            // index = 2  → 2026-06
            // index = 3  → 2026-07
            let chartDate = new Date(
                today.getFullYear(),
                today.getMonth() + index,
                1
            );

            // Aluth month eke year saha month gannawa
            year = chartDate.getFullYear().toString();
            month = (chartDate.getMonth() + 1).toString().padStart(2, "0");


            // Adala month ekata income eka backend eken gannawa
            mounthlyIncome = getDataAjaxGetRequest(
                "/report/mounthlyincome/" + month
            );


            // Chart label ekata year-month format eka hadanawa
            yearAndMonth = year + "-" + month;


            // Chart labels array ekata month eka add karanawa
            monthName.push(yearAndMonth);

            // Chart data array ekata income eka add karanawa
            monthQuentity.push(mounthlyIncome);


            // Console eke index ekata adala month eka display karanawa
            console.log("index = " + index + " → " + yearAndMonth);
        }

        // Chart display karana canvas eka gannawa
        const ctx = document.getElementById("paymentChart");

        // Bar chart eka create karanawa
        new Chart(ctx, {
            type: "bar",
            data: {
                // X-axis ekata month labels set karanawa
                labels: monthName,
                datasets: [{
                    // Dataset eke label eka
                    label: "Income (Rs.)",
                    // Maas walata adala income values set karanawa
                    data: monthQuentity,
                    // Bar wala paata set karanawa
                    backgroundColor: [
                        "#005fa3",
                        "#005fa3",
                        "#005fa3",
                        "#005fa3",
                        "#005fa3",
                        "#005fa3"
                    ],
                    // Bar wala kon round karanawa
                    borderRadius: 8
                }]
            },

            options: {
                // Screen size anuwa chart eka resize wenna denna
                responsive: true,
                // Container eke height eka use karanna
                maintainAspectRatio: false,
                plugins: {
                    // Legend eka hide karanawa
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        // Y-axis eka 0 idala patan gannawa
                        beginAtZero: true
                    }
                }
            }
        });

        // Login wela inna userge role eka backend eken gannawa
        loggedUserRole = getDataAjaxGetRequestForString("/rolecheck/whatisloggeduserrole");

        // User role eka console eke balagannawa
        console.log(loggedUserRole);
        // Logged user role eka anuwa dashboard modules show/hide karanawa

        if (loggedUserRole == "Manager") {

            // Manager ta siyalu dashboard sections pennanawa
            galleryDivAreaId.style.display = "block";
            chartDivAreaId.style.display = "block";
            studentregistrationDivAreaId.style.display = "block";
            attendanceDivAreaId.style.display = "block";
            studentpaymentDivAreaId.style.display = "block";

        } else if (loggedUserRole == "Coordinator") {

            // Coordinator ta gallery saha student management sections pennanawa
            // Chart section eka hide karanawa
            galleryDivAreaId.style.display = "block";
            chartDivAreaId.style.display = "none";
            studentregistrationDivAreaId.style.display = "block";
            attendanceDivAreaId.style.display = "block";
            studentpaymentDivAreaId.style.display = "block";

        } else if (loggedUserRole == "Receptionist") {

            // Receptionist ta gallery, registration saha payment sections pennanawa
            // Chart saha attendance sections hide karanawa
            galleryDivAreaId.style.display = "block";
            chartDivAreaId.style.display = "none";
            studentregistrationDivAreaId.style.display = "block";
            attendanceDivAreaId.style.display = "none";
            studentpaymentDivAreaId.style.display = "block";

        } else if (loggedUserRole == "Card-Checker") {

            // Card-Checker ta attendance section witharak pennanawa
            // Registration, payment saha chart sections hide karanawa
            galleryDivAreaId.style.display = "block";
            chartDivAreaId.style.display = "none";
            studentregistrationDivAreaId.style.display = "none";
            attendanceDivAreaId.style.display = "block";
            studentpaymentDivAreaId.style.display = "none";
        }
