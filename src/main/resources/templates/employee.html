<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragment :: headerFragment}">
</head>

<body>
    <!-- Container start -->
    <div class="container-fluid">
        <div th:replace="~{fragment :: sidebarFrgment}"></div>
        <div class="view-content">
            <!-- card title area start -->
            <div class="card div-card mx-auto mt-3" style="max-width: 70rem;">
                <div class="card-header div-head">
                    <!-- title section strat -->
                    <div class="row mt-2">
                        <div class="d-flex justify-content-start">
                            <i class="fa-solid fa-user-tie"></i>
                            <h3 class="h3 ms-3 "> Employee Management</h3>
                            <div class="col text-end">
                                <ul class="nav nav-tabs float-end">
                                    <li class="nav-item p-1">
                                        <button id="tabFormButton" class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#tabFormArea" type="button"
                                            style="background-color: rgba(240, 248, 255, 0.765);">Add Employee
                                        </button>
                                    </li>

                                    <li class="nav-item p-1">
                                        <button class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#tabTableArea" type="button"
                                            style="background-color: rgba(240, 248, 255, 0.838);">View
                                            Employee data</button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <!-- title section end -->
                </div>
            </div>
            <div class="tab-content">
                <!-- employee Form -->
                <div class="tab-pane fade" id="tabFormArea">
                    <div class="row">
                        <div class="col">
                            <div class="card div-card mx-auto mt-2" style="max-width: 70rem;">
                                <div class="card-body">
                                    <!-- default submition eka wada krnawa auto html wala..api wenama submit function ekak use krnawnam default eka wada krna eka nawaththanna ona klin...defult method post -->
                                    <form id="formEmployee" onsubmit="return false">
                                        <div class="row ">
                                            <!-- required mark start -->
                                            <div class="col text-end fw-bold">
                                                <p>Required<span class="text-danger">*</span></p>
                                            </div>
                                            <!-- required mark end -->
                                        </div>
                                        <div class="row mt-1 ">
                                            <!-- Employee fullname area start -->
                                            <label for="textEmpFullname" class="col-2 form-label fw-bold mt-2">
                                                Full Name :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="text" required id="textEmpFullname"
                                                    class="form-control form-input" placeholder="Enter Full Name Here"
                                                    onkeyup="textFullnameValidator()">
                                            </div>
                                            <!-- Employee fullname area end -->
                                            <!-- Name with area start -->
                                            <label for="textEmpNameWithInitial" class="col-2 form-label fw-bold mt-2">
                                                Name (Initials) :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="text" required id="textEmpNameWithInitial"
                                                    class="form-control form-input"
                                                    placeholder="Enter Initial with Name Here" disabled>
                                            </div>
                                            <!-- Name with initial area end -->


                                        </div>
                                        <div class="row mt-2">
                                            <!-- Employee calling name area start -->
                                            <label for="selectCallingName" class="col-2 form-label fw-bold mt-2">
                                                Calling Name :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <select id="selectCallingName" required class="form-select form-input"
                                                    onchange="callingNameValidator()">
                                                    <option value="" selected disabled>Select Calling name</option>
                                                    <option value="">Name-1</option>
                                                    <option value="">Name-2</option>
                                                </select>
                                            </div>
                                            <!-- Employee calling name area end -->
                                            <!-- Employee NIC area start -->
                                            <label for="textEmpNic" class="col-2 form-label fw-bold mt-2">
                                                NIC :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="text" placeholder="Enter NIC Here" required id="textEmpNic"
                                                    class="form-control form-input" onkeyup="textNicValidator()">
                                            </div>
                                            <!-- Employee NIC area end -->

                                        </div>
                                        <div class="row mt-2">
                                            <!-- Employee Age area start -->
                                            <label for="textEmpAge" class="col-2 form-label fw-bold mt-2">
                                                Age :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="text" placeholder="Enter Age Here" required id="textEmpAge"
                                                    class="form-control form-input" disabled>
                                            </div>
                                            <!-- Employee Age area end -->
                                            <!-- Employee gender select area end -->
                                            <label class="col-2 form-label fw-bold mt-2">
                                                Gender:
                                                <span class="text-danger">*</span>
                                            </label>

                                            <div class="col-4">
                                                <div class="form-check form-check-inline">
                                                    <input type="radio" value="Male" id="radioMale" name="gender"
                                                        class="form-check-input form-input" required>
                                                    <label for="radioMale" class="form-check-label">Male</label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <input type="radio" value="Female" id="radioFemale" name="gender"
                                                        class="form-check-input form-input">
                                                    <label for="radioFemale" class="form-check-label">Female</label>
                                                </div>
                                            </div>
                                            <!-- Employee gender select area end -->


                                        </div>
                                        <div class="row mt-2">
                                            <!-- Employee birthdate area start -->
                                            <label for="dateEmpDob" class="col-2 form-label fw-bold mt-2">
                                                Date of Birth :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="date" class="form-control form-input" required
                                                    id="dateEmpDob" onkeydown="return false;" disabled onchange="employee.dob=this.value;
                                this.style.border='2px solid green';">
                                            </div>
                                            <!-- Employee birthdate area end -->
                                            <!-- Employee Mobile no area start -->
                                            <label for="textEmpMobileno" class="col-2 form-label fw-bold mt-2">
                                                Mobile Number :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="text" required id="textEmpMobileno"
                                                    class="form-control form-input "
                                                    placeholder="Enter Mobile Number Here"
                                                    onkeyup="inputTextValidator(this,'^[0][7][01245678][0-9]{7}$','employee','mobileno')">
                                            </div>
                                            <!-- Employee Mobile no area end -->
                                        </div>
                                        <!-- DOB ,mobile no section end-->
                                        <!-- land no , email section start-->
                                        <div class="row mt-2">
                                            <!-- Employee Land no area start -->
                                            <label for="textEmpLandno" class="col-2 form-label fw-bold mt-2">
                                                Land Number :
                                            </label>
                                            <div class="col-4">
                                                <input type="text" id="textEmpLandno" class="form-control form-input"
                                                    placeholder="Enter Land Number(Optional) Here"
                                                    onkeyup="inputTextValidator(this,'^[0][123456789][1-9][0-9]{7}$','employee','landno')">
                                            </div>
                                            <!-- Employee Land no area end -->
                                            <!-- Employee Email area start -->
                                            <label for="textEmpEmail" class="col-2 form-label fw-bold mt-2">
                                                Email :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <input type="email" required id="textEmpEmail"
                                                    class="form-control form-input" placeholder="Enter Email Here"
                                                    onkeyup="inputTextValidator(this,'^[a-z]{1,20}[a-z0-9\\*\\#]{0,20}[@][a-z]{4,10}[.][a-z]{2,3}$','employee','email')">
                                            </div>
                                            <!-- Employee Email area end -->
                                        </div>
                                        <!-- land no , email section end-->
                                        <!-- address ,note section start -->
                                        <div class="row mt-2">
                                            <!-- Employee address area start -->
                                            <label for="textEmpAddress" class="col-2 form-label fw-bold mt-2">
                                                Address :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <textarea class="form-control form-input" id="textEmpAddress"
                                                    onkeyup="inputTextValidator(this,'^[A-Za-z0-9 ,/.-]{5,100}$','employee','address')"
                                                    placeholder="Enter Address Here" required></textarea>
                                                <!-- ^([A-Za-z0-9\\,\\/\\-]{2,15}[\\,]{0,1}[ ]){1,10}([A-Z][a-z]{2,15}[.])$ -->
                                            </div>
                                            <!-- Employee address area end -->
                                            <!-- Employee Photo area start -->
                                            <label for="fileEmpPhoto" class="col-2 form-label fw-bold mt-2">
                                                Employee Photo :
                                            </label>
                                            <div class="col-4">
                                                <img src="images/usericon.jpg" id="imgEmpPhoto"
                                                    style="width: 75px; height: 75px; border-radius: 50%;">
                                                <button class="btn fw-bold"
                                                    style="background-color: rgb(164, 201, 232);"
                                                    onclick="fileEmpPhoto.click()">Select a
                                                    Photo</button>
                                                <button class="btn fw-bold"
                                                    style="background-color: rgb(164, 201, 232);"
                                                    onclick="clearPhoto()">Clear</button>
                                                <input type="file" id="fileEmpPhoto" class="form-control form-input"
                                                    style="display: none;"
                                                    onchange="validateFile(this,employee,'photo',imgEmpPhoto)">
                                            </div>
                                            <!-- Employee Photo area end -->

                                        </div>

                                        <div class="row mt-2">
                                            <!-- Employee Designation -->
                                            <label for="selectEmpDesignation" class="col-2 form-label fw-bold mt-2">
                                                Designation :
                                                <span class="text-danger">*</span>
                                            </label>

                                            <div class="col-4">
                                                <div class="input-group">

                                                    <select required class="form-select form-input"
                                                        id="selectEmpDesignation" onchange="employee.designation_id = JSON.parse(this.value);
                          this.style.border='2px solid green';">

                                                        <option value="" selected disabled>Select Designation</option>
                                                        <option value="Manager">Manager</option>
                                                        <option value="Receptionist">Receptionist</option>
                                                        <option value="Coordinator">Coordinator</option>

                                                    </select>

                                                    <button type="button" class="btn"
                                                        style="background-color: rgb(164, 201, 232);"
                                                        data-bs-toggle="modal" data-bs-target="#designationModal"
                                                        onclick="loadDesignationForm()">
                                                        New
                                                    </button>

                                                </div>
                                            </div>
                                            <!-- Employee Civil status area end -->
                                            <label for=" selectEmpCivilStatus" class="col-2 form-label fw-bold mt-2">
                                                Civil status :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4">
                                                <select required class="form-select form-input"
                                                    id="selectEmpCivilStatus" name="civilstatus" onchange="employee.civilstatus=this.value;
                                this.style.border='2px solid green';">
                                                    <option value="" selected disabled>Select Employee
                                                        Civil
                                                        Status..!
                                                    </option>
                                                    <option value="Single">Single</option>
                                                    <option value="Married">Married</option>
                                                </select>
                                            </div>
                                            <!-- Employee Civil status area end -->

                                        </div>
                                        <div class="row mt-2">
                                            <!-- Employee  status area start -->
                                            <label for="selectEmployeeStatus" id="labelEmployeeStatus"
                                                class="col-2 form-label fw-bold mt-2">
                                                Employee Status :
                                                <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-4" id="divSelectEmployeeStatus">
                                                <select id="selectEmployeeStatus" onchange="employee.employeestatus_id=JSON.parse(this.value);
                                this.style.border='2px solid green';" class="form-select form-input">
                                                    <option value="" selected disabled>Select Employee Status
                                                    </option>
                                                    <option value="Working">Working</option>
                                                    <option value="Resign">Resign</option>
                                                    <option value="Removed">Removed</option>
                                                </select>
                                            </div>
                                            <!-- Employee  status area end -->
                                        </div>

                                        <!-- buttons area start -->
                                        <div class="row mt-2">
                                            <div class="d-flex justify-content-center gap-2 mt-3">
                                                <button class="btn fw-bold btnall btn-clear" id="buttonClear"
                                                    type="button" onclick="clearFormData('formEmployee','employee')">
                                                    <i class="fa-solid fa-recycle"></i> Clear
                                                </button>
                                                <button class="btn fw-bold btnall btn-update" id="buttonUpdate"
                                                    type="button" onclick="buttonEmployeeUpdate()">
                                                    <i class="fa-solid fa-edit"></i> Update
                                                </button>
                                                <button class="btn fw-bold btnall btn-submit" id="buttonSubmit"
                                                    type="button" onclick="buttonEmployeeSubmit()">
                                                    <i class="fa-solid fa-paper-plane"></i> Submit
                                                </button>
                                            </div>

                                        </div>

                                        <!-- buttons area end -->

                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Employee Table  area start-->
                <div class="tab-pane fade  show active" id="tabTableArea">
                    <div class="row">
                        <div class="col">
                            <div class="card div-card mx-auto mt-3" style="max-width: 70rem;">
                                <div class="card-body">
                                    <table id="tableEmployee" class="table table-hover table-bordered table-striped ">
                                        <thead class="text-dark tablehead tableh">
                                            <tr>
                                                <th>No</th>
                                                <th>Emp no</th>
                                                <th>Fullname</th>
                                                <!-- <th>Callingname</th> -->
                                                <!-- <th>NIC</th> -->
                                                <!-- <th>Email</th> -->
                                                <!-- <th>Mobile</th> -->
                                                <!-- <th>Gender</th> -->
                                                <!-- <th>Photo</th> -->
                                                <th>Designation</th>
                                                <th>Status</th>
                                                <th>Modify</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tableBodyEmployee">

                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Employee Table  area end-->
        </div>

    </div>

    <!-- Employee Print Modal -->
    <div class="modal modalPrint" id="modalEmployeePrint">
        <div class="modal-dialog">
            <div class="modal-content div-card">
                <div class="modal-header">
                    <h4>Print Employee</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>
                <div class="modal-body">
                    <table class="tablePrint table table-bordered table-hover" id="tablePrintEmployee">
                        <tbody>
                            <tr>
                                <th>Full Name</th>
                                <td id="tdFullName"></td>
                            </tr>
                            <tr>
                                <th>Calling Name</th>
                                <td id="tdCallingName"></td>
                            </tr>
                            <tr>
                                <th>NIC</th>
                                <td id="tdNic"></td>
                            </tr>
                            <tr>
                                <th>Gender</th>
                                <td id="tdGender"></td>
                            </tr>
                            <tr>
                                <th>Mobile Number</th>
                                <td id="tdMobile"></td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td id="tdEmail"></td>
                            </tr>
                            <tr>
                                <th>Address</th>
                                <td id="tdAddress"></td>
                            </tr>
                            <tr>
                                <th>Designation</th>
                                <td id="tdDesignation"></td>
                            </tr>
                            <tr>
                                <th>Civil Status</th>
                                <td id="tdCivilStatus"></td>
                            </tr>
                            <tr>
                                <th>Employee Status</th>
                                <td id="tdEmployeeStatus"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="buttonPrint()" class="btn btn-secondary">
                        Print
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- designation form -->
    <div class="modal" id="designationModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4>Add New Designation</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>
                <div class="modal-body">
                    <form id="formDesignation" onsubmit="return false">
                        <!-- default submition eka wada krnawa auto html wala..api wenama submit function ekak use krnawnam default eka wada krna eka nawaththanna ona klin...defult method post -->
                        <!-- required mark start -->
                        <div class="row mt-1">
                            <div class="col text-end fw-bold">
                                <p>Required<span class="text-danger">*</span></p>
                            </div>
                        </div>
                        <!-- required mark end -->

                        <div class="row mt-4">
                            <!-- Designation area start -->
                            <label for="textDesignation" class="col-5 form-label fw-bold">
                                Designation name :
                                <span class="text-danger">*</span>
                            </label>
                            <div class="col-7">
                                <input type="text" id="textDesignation" class="form-control form-input"
                                    placeholder="Enter Designation Name Here" required
                                    onkeyup="inputTextValidator(this,'^([A-Z][a-z]{2,20})(\\s([A-Z][a-z]{2,20}))*$','designation','name')">
                            </div>
                            <!-- Designation name area end -->
                        </div>
                        <div class="row mt-4">
                            <!--  Need User Account area start -->
                            <label for="chkNeedUserAccount" class="form-label fw-bold col-5">
                                Need User Account :
                                <span class="text-danger">*</span>
                            </label>
                            <div class="col-7">
                                <div class="form-check form-check-inline">

                                    <input type="checkbox" required id="chkNeedUserAccount" class="form-check-input"
                                        onchange="
                        if (this.checked) {
                            lblUserAccount.innerText = 'User Account Needed..!';
                            designation.useraccount = true;
                        } else {
                            lblUserAccount.innerText = 'User Account Not Needed..!';
                            designation.useraccount = false;
                        }">

                                    <label for="chkNeedUserAccount" class="form-check-label fw-bold form-label"
                                        id="lblUserAccount">
                                        User Account Not Needed..!
                                    </label>

                                </div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <!-- RoleId area start -->
                            <label for="textRoleId" class="col-5 form-label fw-bold">
                                Role Id :
                                <span class="text-danger">*</span>
                            </label>
                            <div class="col-7">
                                <input type="text" id="textRoleId" class="form-control form-input"
                                    placeholder="Enter Role Id Here" required
                                    onkeyup="inputTextValidator(this,'^[0-9]{0,2}$','designation','roleid')">
                            </div>
                            <!-- RoleId name area end -->
                        </div>


                        <!-- buttons area start -->
                        <div class="row mt-3">
                            <div class="col-12 d-flex justify-content-end">
                                <button class="btn fw-bold btnall btn-submit" id="btnSubmitDesignation" type="button"
                                    onclick="buttonDesignationSubmit()">Submit
                                </button>
                            </div>
                        </div>
                        <!-- buttons area end -->
                    </form>
                </div>

            </div>

        </div>
    </div>


    <div th:replace="~{fragment :: footerFragment}"></div>

    <!-- linkemployee js file -->
    <script src="modaljs/employee.js"></script>
    <!-- linkemployee js file -->
    <script src="js/tablefunction.js"></script>

</body>

</html>
