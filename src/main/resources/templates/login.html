<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Add title area for login page -->
    <title>Jithma Institute | Login </title>
    <!-- add icon are -->
    <link rel="icon" href="images/IT.png" type="image">
    <!-- link boostrap css file -->
    <link rel="stylesheet" href="bootstrap-5.2.3/css/bootstrap.min.css">
    <!-- link css file -->
    <link rel="stylesheet" href="styles/l.css">
</head>

<body>
    <div class="login-box shadow-lg">
        <div class="row g-0">

            <!-- Left Image -->
            <div class="col-md-6 login-image"></div>

            <!-- Right Login Form -->
            <div class="col-md-6 p-4 text-center d-flex align-items-center">

                <form class="w-100" action="/login" method="post">
                    <h2 class="fw-bold mb-4 text-dark">Login</h2>

                    <!-- Username -->
                    <div class="input-group mb-3">
                        <span class="input-group-text span-login"><i class="fas fa-user"></i></span>
                        <input type="text" autocomplete="off" name="username" class="form-control input-text" placeholder="Enter Username"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="input-group mb-2">
                        <span class="input-group-text span-login"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control input-text"
                            placeholder="Enter Password" required>
                    </div>

                    <!-- Error Message -->
                    <div class="text-danger mb-2 small" th:if="${param.error}">
                        Please enter valid user details!
                    </div>

                    <!-- Login Button -->
                    <button class="btn btn-login fw-bold mt-2" type="submit">Login</button>

                    <!-- Forgot Password -->
                    <!-- <div class="mt-3 text-dark fw-semibold" style="cursor:pointer;">
                        Forgot password?
                    </div> -->
                </form>

            </div>
        </div>
    </div>

    <!-- link boostrap js file -->
    <script src="bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>

    <!-- link fontawesome js file -->
    <script src="fontawesome-6.7.2/js/all.min.js"></script>
</body>

</html>
