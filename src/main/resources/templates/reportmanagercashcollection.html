<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragment :: headerFragment}">
</head>

<body>

    <!-- container start -->
    <div class="container-fluid">
        <!-- sidebar start -->
        <div th:replace="~{fragment :: sidebarFrgment}"></div>
        <!-- sidebar end -->
        <!-- view content start -->
        <div class="view-content">
            <!-- title card start -->
            <div class="card div-card mx-auto mt-3" style="max-width:75rem;">
                <div class="card-header div-head">
                    <div class="row mt-2">
                        <div class="d-flex justify-content-center">
                            <i class="fa-solid fa-file-lines"></i>
                            <h3 class="h3 ms-3">
                               Cash Collection Report / Manager
                            </h3>
                            <div class="col text-end">
                                <button type="button"
                                    id="btnPrintReport"
                                    class="btn btn-light fw-bold"
                                    style="background-color:rgba(240,248,255,0.8);">

                                    <i class="fa-solid fa-print"></i>
                                    Print Report
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- title card end -->
            <!-- filter card start -->
            <div class="card div-card mx-auto mt-3" style="max-width:75rem;">
                <div class="card-body">
                    <div class="row justify-content-center">
                        <!-- From Date -->
                        <div class="col-lg-3 col-md-6">

                            <label class="form-label fw-bold">
                                From Date :
                            </label>
                            <input type="date"
                                id="inputFromDate"
                                class="form-control form-input">
                        </div>
                        <!-- To Date -->
                        <div class="col-lg-3 col-md-6">
                            <label class="form-label fw-bold">
                                To Date :
                            </label>
                            <input type="date"
                                id="inputToDate"
                                class="form-control form-input">
                        </div>
                        <!-- Generate Button -->

                        <div class="col-lg-2 col-md-6 d-flex align-items-end justify-content-center">
                            <button type="button"
                                id="btnGenerateReport"
                                class="btn fw-bold w-100"
                                style="background-color:rgb(162,197,227);"
                                onclick="generateManagerCashCollectionReport();">
                                <i class="fa-solid fa-file-lines"></i>
                                Generate

                            </button>
                        </div>
                    </div>
                </div>

                <!-- Summary section -->

                <div class="row m-3 justify-content-center">
                    <div class="col-md-3">
                        <div class="alert alert-primary text-center">
                            <strong>
                                Total Transactions :
                            </strong>
                            <span id="totalTransactions">
                                0
                            </span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="alert alert-success text-center">
                            <strong>
                                Total Collection :
                            </strong>
                            Rs.
                            <span id="totalCollection">
                                0.00
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Summary section end -->

                <!-- Report table start -->
                <div class="row mx-3 mb-3">
                    <div class="col">
                        <table id="tableManagerCashCollection"
                            class="table table-hover table-bordered table-striped">
                            <thead class="tablehead tableh text-center">
                                <tr>
                                    <th>No</th>
                                    <th>Collected By</th>
                                    <th>Amount</th>
                                    <th>Payment Date</th>
                                </tr>
                            </thead>
                            <tbody id="tableBodyManagerCashCollection">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Report table end -->


            </div>
            <!-- filter card end -->
        </div>
        <!-- view content end -->
    </div>
    <!-- container end -->
    <div th:replace="~{fragment :: footerFragment}"></div>
    <!-- JS -->

    <script src="reportjs/reportmanagercashcollection.js"></script>
</body>

</html>
